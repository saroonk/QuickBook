{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuickBook Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/index.css'%}">
    {% csrf_token %}



</head>

<body>

<div class="container-fluid">
    <div class="row min-vh-100">

        <aside class="col-12 col-md-3 col-lg-2 bg-dark text-white p-3">

            <h4 class="mb-4">QuickBook</h4>

            <div class="nav flex-column">

                <button
                    class="btn btn-dark text-start mb-2"
                    onclick="showSection('dashboard')"
                >
                    Dashboard
                </button>

                <button
                    class="btn btn-dark text-start mb-2"
                    onclick="showSection('vendors')"
                >
                    Vendors
                </button>

                <button
                    class="btn btn-dark text-start mb-2"
                    onclick="showSection('events')"
                >
                    Events
                </button>

                <button
                    class="btn btn-dark text-start mb-2"
                    onclick="showSection('users')"
                >
                    Users
                </button>

            </div>

        </aside>


        <main class="col-12 col-md-9 col-lg-10 p-4">

            <h2 class="mb-4">Dashboard</h2>

            <section id="dashboard-section">

                <div class="row g-3">

                    <div class="col-6 col-lg-3">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h6>Customers</h6>
                                <h3 id="customer-count">0</h3>
                            </div>
                        </div>
                    </div>

                    <div class="col-6 col-lg-3">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h6>Vendors</h6>
                                <h3 id="vendor-count">0</h3>
                            </div>
                        </div>
                    </div>

                    <div class="col-6 col-lg-3">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h6>Events</h6>
                                <h3 id="event-count">0</h3>
                            </div>
                        </div>
                    </div>

                    <div class="col-6 col-lg-3">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h6>Bookings</h6>
                                <h3 id="booking-count">0</h3>
                            </div>
                        </div>
                    </div>

                </div>

            </section>


            <section id="vendors-section" class="d-none">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3>Vendors</h3>

                        <button
                            class="btn btn-primary"
                            data-bs-toggle="modal"
                            data-bs-target="#vendorModal"
                            onclick="openAddVendorModal()"
                        >
                            Add Vendor
                        </button>
                </div>

                <div id="vendors-list" class="row g-4"></div>

            </section>


            <div class="modal fade" id="vendorModal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">

                        <div class="modal-header">
                            <h5 class="modal-title" id="vendorModalTitle">
                                Add Vendor
                            </h5>

                            <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="modal"
                            ></button>
                        </div>

                        <div class="modal-body">

                            <input type="hidden" id="vendor-id">

                            <div class="mb-3">
                                <label class="form-label">Name</label>
                                <input
                                    type="text"
                                    id="vendor-name"
                                    class="form-control"
                                >
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input
                                    type="email"
                                    id="vendor-email"
                                    class="form-control"
                                >
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Phone</label>
                                <input
                                    type="text"
                                    id="vendor-phone"
                                    class="form-control"
                                >
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Address</label>
                                <textarea
                                    id="vendor-address"
                                    class="form-control"
                                    rows="3"
                                ></textarea>
                            </div>

                        </div>

                        <div class="modal-footer">
                            <button
                                type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal"
                            >
                                Cancel
                            </button>

                            <button
                                type="button"
                                class="btn btn-primary"
                                onclick="saveVendor()"
                            >
                                Save
                            </button>
                        </div>

                    </div>
                </div>
            </div>




           <section id="events-section" class="d-none">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3>Events</h3>

                    <button
                        class="btn btn-primary"
                        data-bs-toggle="modal"
                        data-bs-target="#eventModal"
                        onclick="openAddEventModal()"
                    >
                        Add Event
                    </button>
                </div>

                <div class="row g-3 mb-4">

                    <div class="col-12 col-md-4">
                        <label for="event-search" class="form-label">
                            Search Event
                        </label>
                        <input
                            type="text"
                            id="event-search"
                            class="form-control"
                            placeholder="Enter event name"
                        >
                    </div>

                    <div class="col-12 col-md-3">
                        <label for="event-date-from" class="form-label">
                            From Date
                        </label>
                        <input
                            type="date"
                            id="event-date-from"
                            class="form-control"
                        >
                    </div>

                    <div class="col-12 col-md-3">
                        <label for="event-date-to" class="form-label">
                            To Date
                        </label>
                        <input
                            type="date"
                            id="event-date-to"
                            class="form-control"
                        >
                    </div>

                    <div class="col-12 col-md-2 d-flex align-items-end">
                        <button
                            type="button"
                            class="btn btn-outline-secondary w-100"
                            onclick="loadEvents()"
                        >
                            Apply
                        </button>
                    </div>

                </div>

                <div id="events-list" class="row g-4"></div>

            </section>



            <div class="modal fade" id="eventModal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">

                        <div class="modal-header">
                            <h5 class="modal-title" id="eventModalTitle">
                                Add Event
                            </h5>

                            <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="modal"
                            ></button>
                        </div>

                        <div class="modal-body">

                            <input type="hidden" id="event-id">

                            <div class="mb-3">
                                <label for="event-name" class="form-label">
                                    Event Name
                                </label>
                                <input
                                    type="text"
                                    id="event-name"
                                    class="form-control"
                                >
                            </div>

                            <div class="mb-3">
                                <label for="event-vendor" class="form-label">
                                    Vendor
                                </label>
                                <select
                                    id="event-vendor"
                                    class="form-select"
                                >
                                    <option value="">Select Vendor</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="event-description" class="form-label">
                                    Description
                                </label>
                                <textarea
                                    id="event-description"
                                    class="form-control"
                                    rows="3"
                                ></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="event-date" class="form-label">
                                    Event Date & Time
                                </label>
                                <input
                                    type="datetime-local"
                                    id="event-date"
                                    class="form-control"
                                >
                            </div>

                            <div class="mb-3">
                                <label for="event-total-seats" class="form-label">
                                    Total Seats
                                </label>
                                <input
                                    type="number"
                                    id="event-total-seats"
                                    class="form-control"
                                    min="1"
                                >
                            </div>

                        </div>

                        <div class="modal-footer">
                            <button
                                type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal"
                            >
                                Cancel
                            </button>

                            <button
                                type="button"
                                class="btn btn-primary"
                                onclick="saveEvent()"
                            >
                                Save
                            </button>
                        </div>

                    </div>
                </div>
            </div>





            <section id="users-section" class="d-none">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3>Users</h3>
                </div>

                <div id="users-list" class="row g-4"></div>

                <div class="d-flex justify-content-center mt-4">
                    <button
                        id="users-previous"
                        class="btn btn-outline-secondary me-2"
                        onclick="loadUsers(usersPreviousUrl)"
                        disabled
                    >
                        Previous
                    </button>

                    <button
                        id="users-next"
                        class="btn btn-outline-primary"
                        onclick="loadUsers(usersNextUrl)"
                        disabled
                    >
                        Next
                    </button>
                </div>

            </section>



            <section id="user-detail-section" class="d-none">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3>User Details</h3>
                        <p class="text-muted mb-0" id="user-detail-username"></p>
                    </div>

                    <button
                        class="btn btn-outline-secondary"
                        onclick="showSection('users')"
                    >
                        Back to Users
                    </button>
                </div>

                <div id="user-detail-content"></div>
            </section>





        </main>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/script.js' %}"></script>

</body>
</html>
